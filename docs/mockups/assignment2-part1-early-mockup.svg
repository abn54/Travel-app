<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
  <title id="title">Expedia Lite Assignment 2 Part 1 early hotel map mockup</title>
  <desc id="description">A sketch showing a ZIP code search, feedback states, selected hotel cards, and matching numbered map markers.</desc>
  <rect width="1280" height="800" fill="#f5f7fb"/>
  <rect x="38" y="28" width="1204" height="70" rx="14" fill="#071d49"/>
  <circle cx="80" cy="63" r="17" fill="#ffcd00"/>
  <text x="108" y="73" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Expedia Lite</text>
  <text x="1007" y="69" font-family="Arial, sans-serif" font-size="17" fill="#dcecff">Part 1 early interaction sketch</text>

  <rect x="38" y="122" width="1204" height="156" rx="16" fill="#ffffff" stroke="#c7d8ef" stroke-width="2"/>
  <text x="72" y="164" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#071d49">Find hotels near a U.S. ZIP code</text>
  <text x="72" y="193" font-family="Arial, sans-serif" font-size="15" fill="#55647a">The backend confirms the requested ZIP, then searches a 5 km circle around its returned center.</text>
  <text x="72" y="229" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172033">ZIP code</text>
  <rect x="72" y="239" width="396" height="46" rx="7" fill="#ffffff" stroke="#9fb4d1" stroke-width="2"/>
  <text x="89" y="270" font-family="Arial, sans-serif" font-size="19" fill="#172033">00501</text>
  <rect x="488" y="239" width="218" height="46" rx="7" fill="#ffcd00"/>
  <text x="524" y="269" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#071d49">Search nearby hotels</text>
  <text x="744" y="267" font-family="Arial, sans-serif" font-size="15" fill="#47617f">Loading • invalid ZIP • unresolved ZIP • no results • request failure</text>

  <text x="38" y="326" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#071d49">Example result state: hotels within 5 km of 00501, Holtsville</text>
  <rect x="38" y="350" width="505" height="380" rx="14" fill="#ffffff" stroke="#c7d8ef" stroke-width="2"/>
  <text x="69" y="387" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#071d49">Nearby hotels (3)</text>

  <rect x="66" y="410" width="449" height="82" rx="9" fill="#eaf3ff" stroke="#1668e3" stroke-width="3"/>
  <circle cx="96" cy="450" r="16" fill="#1668e3"/><text x="90" y="456" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <text x="126" y="444" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#071d49">Example Hotel</text>
  <text x="126" y="470" font-family="Arial, sans-serif" font-size="14" fill="#47566d">Address from provider • selected</text>
  <rect x="66" y="507" width="449" height="82" rx="9" fill="#ffffff" stroke="#d7e0ec" stroke-width="2"/>
  <circle cx="96" cy="547" r="16" fill="#47617f"/><text x="90" y="553" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="126" y="541" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#071d49">Provider hotel name</text>
  <text x="126" y="567" font-family="Arial, sans-serif" font-size="14" fill="#47566d">Address shown when provided</text>
  <rect x="66" y="604" width="449" height="82" rx="9" fill="#ffffff" stroke="#d7e0ec" stroke-width="2"/>
  <circle cx="96" cy="644" r="16" fill="#47617f"/><text x="90" y="650" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <text x="126" y="638" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#071d49">Name not provided</text>
  <text x="126" y="664" font-family="Arial, sans-serif" font-size="14" fill="#47566d">Honest missing-field label</text>

  <rect x="570" y="350" width="672" height="380" rx="14" fill="#dcecf6" stroke="#9fc1da" stroke-width="2"/>
  <path d="M590 410 C720 355 850 470 1000 396 S1190 430 1220 382" fill="none" stroke="#ffffff" stroke-width="9" opacity=".8"/>
  <path d="M585 625 C720 530 888 664 1040 548 S1192 566 1230 638" fill="none" stroke="#ffffff" stroke-width="7" opacity=".8"/>
  <circle cx="900" cy="544" r="103" fill="#1668e3" opacity=".12" stroke="#1668e3" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="835" y="679" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0a4aa5">5 km search area</text>
  <circle cx="900" cy="544" r="9" fill="#071d49"/>
  <text x="916" y="550" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#071d49">ZIP center</text>
  <g font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#ffffff" text-anchor="middle">
    <circle cx="830" cy="480" r="22" fill="#1668e3" stroke="#ffffff" stroke-width="4"/><text x="830" y="486">1</text>
    <circle cx="997" cy="507" r="22" fill="#47617f" stroke="#ffffff" stroke-width="4"/><text x="997" y="513">2</text>
    <circle cx="957" cy="606" r="22" fill="#47617f" stroke="#ffffff" stroke-width="4"/><text x="957" y="612">3</text>
  </g>
  <text x="598" y="707" font-family="Arial, sans-serif" font-size="13" fill="#40546f">Map attribution remains visible in the final Leaflet map.</text>
  <text x="40" y="775" font-family="Arial, sans-serif" font-size="14" fill="#55647a">Selection is synchronized: choose a card or a matching numbered marker.</text>
</svg>
