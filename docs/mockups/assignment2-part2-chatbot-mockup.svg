<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title description">
  <title id="title">Expedia Lite Assignment 2 Part 2 early chatbot interaction mockup</title>
  <desc id="description">An early sketch of saved local hotels beside a grounded assistant showing the question, checked SQL, records, answer, loading and no-match states.</desc>
  <rect width="1200" height="730" fill="#f5f7fb"/>
  <rect x="42" y="32" width="1116" height="72" rx="16" fill="#071d49"/>
  <circle cx="76" cy="68" r="15" fill="#ffcd00"/>
  <text x="105" y="76" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Expedia Lite</text>
  <text x="900" y="73" fill="#d9e9ff" font-family="Arial, sans-serif" font-size="16">Part 2 early interaction sketch</text>
  <text x="42" y="150" fill="#071d49" font-family="Arial, sans-serif" font-size="25" font-weight="700">1. Save live provider location locally</text>
  <rect x="42" y="172" width="455" height="228" rx="14" fill="#ffffff" stroke="#c9dfcf" stroke-width="2"/>
  <text x="68" y="214" fill="#071d49" font-family="Arial, sans-serif" font-size="21" font-weight="700">Local Hotels</text>
  <text x="68" y="246" fill="#53627a" font-family="Arial, sans-serif" font-size="16">Scholar Hotel State College</text>
  <text x="68" y="274" fill="#53627a" font-family="Arial, sans-serif" font-size="14">Saved from ZIP 16802 · State College</text>
  <rect x="68" y="300" width="400" height="72" rx="9" fill="#edfaf2"/>
  <text x="84" y="328" fill="#075d35" font-family="Arial, sans-serif" font-size="14" font-weight="700">SIMULATED COURSE DATA</text>
  <text x="84" y="353" fill="#283750" font-family="Arial, sans-serif" font-size="15">Oct 10 · $152 nightly · 3 rooms</text>
  <text x="538" y="150" fill="#071d49" font-family="Arial, sans-serif" font-size="25" font-weight="700">2. Ask grounded local assistant</text>
  <rect x="538" y="172" width="620" height="492" rx="14" fill="#ffffff" stroke="#d9c9f3" stroke-width="2"/>
  <text x="566" y="214" fill="#071d49" font-family="Arial, sans-serif" font-size="20" font-weight="700">Hotel question</text>
  <rect x="566" y="232" width="564" height="62" rx="8" fill="#f8faff" stroke="#b9c5d8"/>
  <text x="582" y="269" fill="#283750" font-family="Arial, sans-serif" font-size="15">Which saved hotel costs the least on Oct. 10?</text>
  <rect x="566" y="312" width="190" height="42" rx="8" fill="#ffcd00"/>
  <text x="585" y="339" fill="#071d49" font-family="Arial, sans-serif" font-size="15" font-weight="700">Ask assistant</text>
  <text x="566" y="388" fill="#071d49" font-family="Arial, sans-serif" font-size="17" font-weight="700">Checked SQL → retrieved rows → grounded answer</text>
  <rect x="566" y="405" width="564" height="66" rx="8" fill="#f7f7fb"/>
  <text x="580" y="433" fill="#29364d" font-family="monospace" font-size="12">SELECT h.name, n.stay_date, n.nightly_rate_usd...</text>
  <text x="580" y="454" fill="#29364d" font-family="monospace" font-size="12">LIMIT 1  [2026-10-10]</text>
  <rect x="566" y="488" width="564" height="56" rx="8" fill="#f7f7fb"/>
  <text x="580" y="522" fill="#29364d" font-family="Arial, sans-serif" font-size="14">Scholar Hotel State College · $152 · 3 rooms</text>
  <rect x="566" y="561" width="564" height="78" rx="8" fill="#fffdf2" stroke="#ffcd00"/>
  <text x="580" y="591" fill="#071d49" font-family="Arial, sans-serif" font-size="15" font-weight="700">Grounded answer</text>
  <text x="580" y="616" fill="#283750" font-family="Arial, sans-serif" font-size="14">Lowest local option; rate and rooms are simulated course data.</text>
  <text x="42" y="452" fill="#53627a" font-family="Arial, sans-serif" font-size="16" font-weight="700">Relevant states</text>
  <rect x="42" y="474" width="455" height="118" rx="12" fill="#fff" stroke="#d8dfeb"/>
  <text x="64" y="508" fill="#53627a" font-family="Arial, sans-serif" font-size="15">Loading: planning safe query and checking local records</text>
  <text x="64" y="540" fill="#8c1515" font-family="Arial, sans-serif" font-size="15">Failure: model service unavailable; records stay unchanged</text>
  <text x="64" y="572" fill="#53627a" font-family="Arial, sans-serif" font-size="15">No match: no local records matched this checked query</text>
  <text x="42" y="685" fill="#53627a" font-family="Arial, sans-serif" font-size="14">The final interface keeps Part 1's ZIP/list/map behavior and adds this local-only, inspectable RAG flow.</text>
</svg>
